# TTS Control Plane Configuration

# Default TTS engine
default_engine = "parler"

# Default sample rate in Hz
default_sample_rate = 24000

# Engine definitions with metadata
# Each engine specifies its backend, license, and capabilities

[engines.parler]
name = "Parler"
backend = "alltalk"
api_type = "gateway"
license = "Apache-2.0"
commercial = true
cloning = false

[engines.piper]
name = "Piper"
backend = "alltalk"
api_type = "gateway"
license = "MIT"
commercial = true
cloning = false

[engines.xtts]
name = "XTTS"
backend = "alltalk"
api_type = "gateway"
license = "CPML"
commercial = false
cloning = true

[engines.dia]
name = "Dia"
backend = "dia"
api_type = "standalone"
license = "Apache-2.0"
commercial = true
cloning = true

[engines.gptsovits]
name = "GPT-SoVITS"
backend = "gptsovits"
api_type = "standalone"
license = "MIT"
commercial = true
cloning = true

[engines.toucan]
name = "Toucan"
backend = "toucan"
api_type = "standalone"
license = "Apache-2.0"
commercial = true
cloning = true

# Backend servers configuration
# Each backend can run on different hosts for distributed setups

[backends.alltalk]
host = "curiosity"
port = 5157

[backends.dia]
host = "curiosity"
port = 1110

[backends.gptsovits]
host = "curiosity"
port = 6910

[backends.toucan]
host = "curiosity"
port = 1721
