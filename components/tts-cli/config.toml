# TTS Control Plane Configuration

# Default TTS engine
default_engine = "parler"

# Default sample rate in Hz
default_sample_rate = 24000

# Backend servers configuration
# Each backend can run on different hosts for distributed setups

[backends.alltalk]
# AllTalk handles: parler, piper, xtts
host = "curiosity"
port = 5157
engines = ["parler", "piper", "xtts"]

[backends.dia]
# Dia 1.6B - Apache 2.0, dialogue TTS
host = "curiosity"
port = 1110
engines = ["dia"]

[backends.gptsovits]
# GPT-SoVITS - MIT, voice cloning
host = "curiosity"
port = 6910
engines = ["gptsovits"]

[backends.toucan]
# IMS-Toucan - Apache 2.0, multilingual TTS
host = "curiosity"
port = 1721
engines = ["toucan"]
