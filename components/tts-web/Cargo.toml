[workspace]
resolver = "2"
members = [
    "crates/tts-web-ui",
    "crates/tts-web-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/softwarewrighter/alltalk-client-rs"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "net"] }

# Web framework (server)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# Yew (WASM UI)
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "console",
    "HtmlSelectElement", "HtmlInputElement", "HtmlTextAreaElement",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "Event", "InputEvent", "MouseEvent", "DragEvent", "DataTransfer",
    "HtmlAudioElement", "Blob", "BlobPropertyBag", "Url",
    "File", "FileList", "FileReader",
    "Navigator", "MediaDevices", "MediaStream", "MediaStreamConstraints",
    "MediaRecorder", "MediaRecorderOptions", "BlobEvent"
] }
gloo-net = "0.6"
gloo-timers = "0.3"
js-sys = "0.3"

# Internal crates (from tts-spec component)
tts-spec-model = { path = "../tts-spec/crates/tts-spec-model" }
tts-spec-script = { path = "../tts-spec/crates/tts-spec-script" }
